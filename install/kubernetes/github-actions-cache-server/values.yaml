# Default values for github-actions-cache-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/falcondev-oss/github-actions-cache-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ''

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

# -- Cache server configuration
# These values are mapped to the application's environment variables.
# See https://gha-cache-server.falcondev.io/getting-started for more details.
config:
  # -- The base URL of your cache server. Must be accessible by your runners.
  # If empty, defaults to the internal Kubernetes service URL.
  apiBaseUrl: ''

  # -- Merge cache parts right after upload instead of on first download.
  # Doubles storage per entry until the parts cleanup job runs.
  eagerMerge: false

  # -- Number of days to keep stale cache data before deleting it. Set to 0 to disable.
  cacheCleanupOlderThanDays: 90

  # -- Maximum bytes occupied by finalized cache payloads. Leave unset to use
  # the filesystem percentage below.
  # cacheMaxSizeBytes: 107374182400

  # -- Maximum filesystem volume usage before Capacity-based Eviction starts.
  cacheFilesystemMaxUsagePercent: 90

  # -- Hours an unreferenced storage folder must remain untouched before it is deleted.
  # Must be at least 1 hour.
  orphanedStorageGracePeriodHours: 24

  # -- Disable all periodic cleanup jobs.
  # disableCleanupJobs: false

  # -- Enable debug logging.
  # debug: false

  # -- API key for the management API. When set, the management API is enabled
  # and protected with this key (passed via the X-Api-Key header).
  # Can also be provided via existingSecret (key: MANAGEMENT_API_KEY).
  managementApiKey: ''

  # -- Read and write cache files through io_uring when the kernel and the
  # container's seccomp profile allow it; otherwise the server falls back to
  # regular file I/O on its own.
  ioUring: true

  # -- Filesystem storage. Cache files live on the persistent volume.
  storage:
    filesystem:
      # -- Path to store cache files
      path: /data/cache

  # -- PostgreSQL database (required).
  # Use either `url` OR individual connection settings (host, port, etc.), or
  # provide DB_POSTGRES_URL / DB_POSTGRES_PASSWORD via existingSecret.
  db:
    postgres:
      # -- Full PostgreSQL connection URL (alternative to individual settings)
      # url: ''
      # -- PostgreSQL database name
      # database: ''
      # -- PostgreSQL host
      # host: ''
      # -- PostgreSQL port
      # port: 5432
      # -- PostgreSQL user
      # user: ''
      # -- PostgreSQL password. Can also be provided via existingSecret.
      # password: ''
      # -- Maximum database connections per replica
      maxConnections: 10

# -- Name of an existing Kubernetes Secret containing sensitive environment variables.
# Use this to avoid storing secrets in values.yaml. The secret keys should match
# the env var names (e.g., DB_POSTGRES_PASSWORD, DB_POSTGRES_URL, MANAGEMENT_API_KEY)
existingSecret: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 3000
  annotations: {}

ingress:
  enabled: false
  className: ''
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /health
    port: cache
readinessProbe:
  httpGet:
    path: /health
    port: cache

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70
  # -- Scaling behavior for the HPA (`spec.behavior`), passed through verbatim.
  # Empty by default, so Kubernetes applies its own defaults.
  # Useful to damp scale-down flapping, e.g.
  # `scaleDown: {stabilizationWindowSeconds: 900, policies: [{type: Pods, value: 1, periodSeconds: 300}]}`.
  behavior: {}

# -- Container lifecycle hooks (`lifecycle`), passed through verbatim.
# Empty by default. A `preStop` hook is the usual way to let in-flight requests
# finish: the container keeps serving while the Service endpoint removal
# propagates to ingress controllers, which is asynchronous. For example
# `preStop: {exec: {command: [/bin/sh, -c, sleep 30]}}` — pair it with a
# terminationGracePeriodSeconds larger than the sleep, or the kubelet will
# SIGKILL the container mid-hook.
lifecycle: {}

# -- Grace period for pod termination (`terminationGracePeriodSeconds`).
# Empty by default, so Kubernetes applies its default of 30.
# Must exceed any `lifecycle.preStop` sleep above.
terminationGracePeriodSeconds: ''

# -- Pod Disruption Budget configuration.
# Disabled by default. When enabled, defaults to maxUnavailable: 1.
podDisruptionBudget:
  # -- Enable/disable the PodDisruptionBudget.
  enabled: false
  # -- Number of pods that can be unavailable during a disruption.
  # Ignored if minAvailable is set.
  maxUnavailable: 1
  # -- Number of pods that must be available during a disruption.
  # Takes precedence over maxUnavailable when set.
  minAvailable: ''

# -- Persistent volume claim for cache storage.
# Enabled by default. Can be overridden with persistentVolumeClaim.enabled = true/false,
# e.g. to mount storage through extraVolumes instead.
#
# NOTE: When using autoscaling (or replicaCount > 1), accessModes is automatically
# switched to ReadWriteMany so that multiple pods can attach to the same volume.
persistentVolumeClaim:
  # -- Set to false to disable. If not set, enabled.
  enabled: null
  # -- Access modes for the PVC. Automatically changed to ReadWriteMany with
  # multiple replicas.
  accessModes:
    - ReadWriteOnce
  storage: 20Gi
  # storageClassName: standard
  annotations: {}
  labels: {}

nodeSelector: {}

tolerations: []

affinity: {}

# -- Additional environment variables to set on the container.
# These are added after the config-generated env vars and can override them.
extraEnv: []
  # - name: MY_VAR
  #   value: "my-value"

# -- Additional envFrom sources to add to the container.
extraEnvFrom: []
  # - secretRef:
  #     name: my-secret
  # - configMapRef:
  #     name: my-config

topologySpreadConstraints: []
