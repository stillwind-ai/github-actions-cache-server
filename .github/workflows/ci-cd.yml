name: 🚥 CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: 🦀 ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            components: rustfmt
            run: cargo fmt --all --check
          # Pedantic lints are enabled in Cargo.toml's [lints.clippy], so local
          # `cargo clippy` runs match CI.
          - name: Clippy (pedantic)
            components: clippy
            cache-key: clippy
            run: |
              cargo clippy --all-targets --all-features --locked -- -D warnings
              cargo clippy --all-targets --no-default-features --locked -- -D warnings
          - name: Check
            cache-key: check
            run: |
              cargo check --all-targets --all-features --locked
              cargo check --all-targets --no-default-features --locked
          - name: Test (io_uring on)
            cache-key: test
            postgres: postgres:17
            io-uring: true
            # The load benchmarks run in quick mode to keep them working; their
            # numbers need a quiet machine.
            run: |
              cargo test --locked
              cargo bench --bench workloads --locked -- --quick
          - name: Test (io_uring off)
            cache-key: test
            postgres: postgres:17
            io-uring: false
            run: cargo test --locked
          # The whole suite again on S3 storage, one bucket per test.
          - name: Test (S3)
            cache-key: test
            postgres: postgres:17
            rustfs: rustfs/rustfs:1.0.0-glibc
            storage-driver: s3
            run: cargo test --locked
    services:
      postgres:
        # An empty image skips the service for entries that don't need it.
        image: ${{ matrix.postgres || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
      rustfs:
        image: ${{ matrix.rustfs || '' }}
        env:
          RUSTFS_ACCESS_KEY: access_key
          RUSTFS_SECRET_KEY: secret_key
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      STORAGE_FILESYSTEM_IO_URING: ${{ matrix.io-uring }}
      TEST_STORAGE_DRIVER: ${{ matrix.storage-driver }}
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_ACCESS_KEY_ID: access_key
      TEST_S3_SECRET_ACCESS_KEY: secret_key
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ matrix.components }}
      - uses: Swatinem/rust-cache@v2
        if: matrix.cache-key
        with:
          key: ${{ matrix.cache-key }}
      - run: ${{ matrix.run }}

  scripts:
    name: 🐍 Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  nix:
    name: ❄️ Nix flake
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets cache-nix-action purge the caches this run supersedes.
      actions: write
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM for the NixOS VM test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
      # The Nix store, kept in the GitHub Actions cache. Before saving, garbage
      # collection drops everything but the GC roots made below, so the cache
      # holds what cache.nixos.org can't provide: crane's build of the
      # dependencies (rebuilt only when Cargo.toml, Cargo.lock or the toolchain
      # change), the package and the NixOS test result.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**', 'Cargo.toml', 'Cargo.lock', 'src/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 0
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      # Builds the package and runs the NixOS module test (nix/test.nix).
      - run: nix flake check -L
      - name: Keep the build results in the cache
        run: >-
          nix build .#default.cargoArtifacts .#default .#checks.x86_64-linux.nixos
          --out-link "$RUNNER_TEMP/gcroots/result"

  docker:
    name: 🐳 Docker image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v6
      # Only to run the arm64 image below; the build itself cross-compiles.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Get build hash
        id: build_hash
        run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: cache-server:ci
          # Matches the deploy job's build args so it can reuse every layer.
          build-args: |
            BUILD_HASH=${{ steps.build_hash.outputs.COMMIT_SHA }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Run the binary
        run: |
          # Without configuration the server must start, then refuse to run.
          output=$(docker run --rm --platform ${{ matrix.platform }} cache-server:ci 2>&1) && exit 1
          echo "$output"
          grep -q "API_BASE_URL is required" <<< "$output"

  helm:
    name: ⎈ Helm chart
    runs-on: ubuntu-latest
    env:
      CHART_DIR: install/kubernetes/github-actions-cache-server
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
      - run: helm lint "$CHART_DIR" --set config.db.postgres.url=postgres://cache@db/cache
      - run: |
          helm template ci "$CHART_DIR" --set config.db.postgres.url=postgres://cache@db/cache > /dev/null
          helm template ci "$CHART_DIR" --set config.db.postgres.host=db --set replicaCount=3 > /dev/null
          helm template ci "$CHART_DIR" --set config.db.postgres.url=postgres://cache@db/cache --set config.storage.driver=s3 --set config.storage.s3.bucket=cache > /dev/null
          # A release without a database, or on S3 without a bucket, must be rejected.
          ! helm template ci "$CHART_DIR" > /dev/null 2>&1
          ! helm template ci "$CHART_DIR" --set config.db.postgres.url=postgres://cache@db/cache --set config.storage.driver=s3 > /dev/null 2>&1
      - run: helm package "$CHART_DIR" --destination packaged

  deploy:
    if: github.event.ref == 'refs/heads/dev'
    name: 🚀 Build and push
    permissions:
      packages: write
      contents: read
    needs: [rust, scripts, nix, docker, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev

      - name: Get build hash
        id: build_hash
        run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            dev

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_HASH=${{ steps.build_hash.outputs.COMMIT_SHA }}
          # Starts from the per-platform layers the docker job above just
          # cached for this commit, so nothing needs to compile again.
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
            type=gha,scope=deploy
          cache-to: type=gha,mode=max,scope=deploy
