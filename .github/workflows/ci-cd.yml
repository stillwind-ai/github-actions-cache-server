name: 🚥 CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: 🦀 ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            components: rustfmt
            run: cargo fmt --all --check
          # Pedantic lints are enabled in Cargo.toml's [lints.clippy], so local
          # `cargo clippy` runs match CI.
          - name: Clippy (pedantic)
            components: clippy
            cache-key: clippy
            run: |
              cargo clippy --all-targets --all-features --locked -- -D warnings
              cargo clippy --all-targets --no-default-features --locked -- -D warnings
          - name: Check
            cache-key: check
            run: |
              cargo check --all-targets --all-features --locked
              cargo check --all-targets --no-default-features --locked
          - name: Test (io_uring on)
            cache-key: test
            postgres: postgres:17
            io-uring: true
            run: cargo test --locked
          - name: Test (io_uring off)
            cache-key: test
            postgres: postgres:17
            io-uring: false
            run: cargo test --locked
    services:
      postgres:
        # An empty image skips the service for entries that don't need it.
        image: ${{ matrix.postgres || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      STORAGE_FILESYSTEM_IO_URING: ${{ matrix.io-uring }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ matrix.components }}
      - uses: Swatinem/rust-cache@v2
        if: matrix.cache-key
        with:
          key: ${{ matrix.cache-key }}
      - run: ${{ matrix.run }}

  scripts:
    name: 🐍 Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  deploy:
    if: github.event.ref == 'refs/heads/dev'
    name: 🚀 Build and push
    permissions:
      packages: write
      contents: read
    needs: [rust, scripts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev

      - name: Get build hash
        id: build_hash
        run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            dev

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_HASH=${{ steps.build_hash.outputs.COMMIT_SHA }}
